[package]
name = "zapbeam"
version = "0.1.0"
description = "A local-first desktop media optimizer"
edition = "2024"
license = "MIT"

[lib]
name = "zapbeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quick-xml = "=0.42.0"
filetime = "0.2.29"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
oxipng = { version = "=10.2.1", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3.27.0"
xattr = "1.7.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
png = "=0.18.1"
